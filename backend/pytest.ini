[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show each test result verbosely
addopts =
    -v
    --tb=short
    --color=yes
    --strict-markers

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow (skipped by default unless --run-slow)
    integration: end-to-end integration test spanning multiple API calls
